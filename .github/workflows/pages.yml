name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install pinned Nida release
        env:
          NIDA_VERSION: '0.8.5'
          NIDA_SHA256: a982311b61210a0e30be5408453e3176d9decbabce6612e61c01433266f3f70f
        run: |
          archive="$RUNNER_TEMP/nida.tar.gz"
          release="https://github.com/MohamedElashri/nida/releases/download/v${NIDA_VERSION}"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 \
            "$release/nida_${NIDA_VERSION}_linux_x86_64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$NIDA_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nida-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nida-bin" nida
          printf '%s\n' "$RUNNER_TEMP/nida-bin" >> "$GITHUB_PATH"

      - name: Check and build the website
        run: |
          nida check site
          nida build site

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
