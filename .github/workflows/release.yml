name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      draft:
        description: Create a draft for testing before publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RAQSH_UPDATER_PUBLIC_KEY: ${{ vars.RAQSH_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check version and install frontend dependencies
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
          : "${RAQSH_UPDATER_PUBLIC_KEY:?Set the repository variable to the Tauri updater public key}"
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          rustup show
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev
      - name: Run unit tests on the tagged source
        run: pnpm test:unit
      - name: Run macOS live tests before signing
        if: runner.os == 'macOS'
        run: pnpm test:macos
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          pnpm desktop:build
          pnpm desktop:bundle --bundles deb,rpm
          mkdir release-assets
          cp target/release/bundle/deb/*.deb release-assets/raqsh-linux-x86_64.deb
          cp target/release/bundle/rpm/*.rpm release-assets/raqsh-linux-x86_64.rpm
          bash scripts/bundle-linux-user.sh \
            release-assets/raqsh-linux-x86_64.deb release-assets/raqsh-linux-x86_64.tar.gz
          python3 bench/scripts/linux-user-install.py release-assets/raqsh-linux-x86_64.tar.gz \
            --legacy-deb release-assets/raqsh-linux-x86_64.deb
      - name: Smoke-test Debian and RPM installation
        if: runner.os == 'Linux'
        run: |
          test "$(dpkg-deb -f release-assets/raqsh-linux-x86_64.deb Package)" = raqsh
          sudo apt-get install -y "$PWD/release-assets/raqsh-linux-x86_64.deb"
          test -x /usr/bin/raqsh
          /usr/bin/raqsh-mcp --help
          docker run --rm \
            --mount "type=bind,src=$PWD/release-assets/raqsh-linux-x86_64.rpm,dst=/tmp/raqsh.rpm,readonly" \
            fedora:43 sh -ec 'dnf -y --setopt=install_weak_deps=False install /tmp/raqsh.rpm
              rpm -q raqsh
              test -x /usr/bin/raqsh
              /usr/bin/raqsh-mcp --help'
      - name: Build and verify the universal macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          pnpm brand:generate
          pnpm --filter raqsh-desktop exec tauri build --target universal-apple-darwin --no-bundle -- --locked
          pnpm desktop:bundle --target universal-apple-darwin --bundles app
          app=target/universal-apple-darwin/release/bundle/macos/Raqsh.app
          for binary in raqsh raqsh-mcp; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64
            lipo "$app/Contents/MacOS/$binary" -verify_arch x86_64
          done
          codesign --verify --deep --strict "$app"
          mkdir release-assets
          ditto -c -k --keepParent "$app" release-assets/raqsh-macos-universal.zip
          COPYFILE_DISABLE=1 tar -czf "$PWD/release-assets/raqsh-macos-universal.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          staged=$(mktemp -d)
          trap 'rm -rf "$staged"' EXIT
          tar -xzf release-assets/raqsh-macos-universal.app.tar.gz -C "$staged"
          codesign --verify --deep --strict "$staged/Raqsh.app"
      - name: Sign update packages with the release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${TAURI_SIGNING_PRIVATE_KEY:?Set the Tauri updater signing key secret}"
          shopt -s nullglob
          packages=(release-assets/*.deb release-assets/*.rpm release-assets/*.app.tar.gz)
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            pnpm exec tauri signer sign --app-version "${RELEASE_TAG#v}" "$package"
            test -s "$package.sig"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RAQSH_UPDATER_PUBLIC_KEY: ${{ vars.RAQSH_UPDATER_PUBLIC_KEY }}
        run: |
          node scripts/release-update.mjs "$RELEASE_TAG" release-assets
          cp install.sh release-assets/install.sh
          cd release-assets
          assets=(install.sh raqsh-linux-x86_64.deb raqsh-linux-x86_64.rpm raqsh-linux-x86_64.tar.gz raqsh-macos-universal.zip raqsh-macos-universal.app.tar.gz latest.json)
          sha256sum "${assets[@]}" > SHA256SUMS
          options=(--verify-tag --generate-notes)
          if [[ "$RELEASE_DRAFT" == true ]]; then options+=(--draft); fi
          gh release create "$RELEASE_TAG" "${options[@]}" "${assets[@]}" SHA256SUMS
