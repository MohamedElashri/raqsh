name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Check version and install frontend dependencies
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          rustup show
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --workspace
          pnpm desktop:build
          pnpm desktop:bundle --bundles deb,rpm
          mkdir release-assets
          cp target/release/bundle/deb/*.deb release-assets/raqsh-linux-x86_64.deb
          cp target/release/bundle/rpm/*.rpm release-assets/raqsh-linux-x86_64.rpm
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?Set APPLE_CERTIFICATE for release signing}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD}"
          keychain="$RUNNER_TEMP/raqsh-release.keychain-db"
          certificate="$RUNNER_TEMP/raqsh-release.p12"
          password=$(openssl rand -hex 24)
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
      - name: Build and verify the universal macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Set APPLE_ID for notarization}"
          : "${APPLE_PASSWORD:?Set APPLE_PASSWORD to an app-specific password}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}"
          [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application:"* ]]
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          pnpm brand:generate
          pnpm --filter visual-board-desktop exec tauri build --target universal-apple-darwin --no-bundle -- --locked
          pnpm desktop:bundle --target universal-apple-darwin --bundles app
          app=target/universal-apple-darwin/release/bundle/macos/visual-board.app
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/visual-board"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/visual-board-mcp"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          mkdir release-assets
          ditto -c -k --keepParent "$app" release-assets/raqsh-macos-universal.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp install.sh release-assets/install.sh
          cd release-assets
          sha256sum install.sh raqsh-linux-x86_64.deb raqsh-linux-x86_64.rpm raqsh-macos-universal.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*
