[package]
name = "raqsh"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.6", default-features = false, features = ["config-json"] }

[dependencies]
serde.workspace = true
board-domain = { path = "../../../crates/domain" }
board-store = { path = "../../../crates/store" }
board-ipc = { path = "../../../crates/ipc" }
raqsh-harnesses = { path = "../../../crates/harnesses" }
raqsh-mcp = { path = "../../../crates/mcp", optional = true }
serde_json.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros", "process"] }
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "x11", "compression"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "zip"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", default-features = false }
webkit2gtk = { version = "=2.0.2", default-features = false, features = ["v2_16"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
combined-mcp = ["dep:raqsh-mcp"]
macos-live-test = ["board-ipc/live-test", "raqsh-harnesses/live-test"]
